env_type: ctrl_world_wm
task_suite_name: libero_spatial
wm_env_type: libero

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 480
max_episode_steps: 480

use_rel_reward: True
reward_coef: 1.0
success_reward_threshold: 0.5

reset_gripper_open: True
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False

specific_reset_id: null

video_cfg:
  save_video: True
  info_on_video: True
  extra_info_on_video: ["policy_action_last"]
  fps: 7
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

ctrl_world_repo_path: "${oc.env:CTRL_WORLD_REPO_PATH}"

ctrl_world_ckpt_path: "${oc.env:CTRL_WORLD_CKPT_PATH}"
ctrl_world_svd_model_path: "${env.train.ctrl_world_repo_path}/pretrained/stable-video-diffusion-img2vid"
ctrl_world_clip_model_path: "${env.train.ctrl_world_repo_path}/pretrained/clip-vit-base-patch32"
ctrl_world_stat_path: "${env.train.ctrl_world_repo_path}/dataset_meta_info/ctrl_world_close_desktop_eef_state_3cam/stat.json"

initial_image_dataset_type: "lerobot_book"
initial_image_state_representation: "auto"
initial_image_path: "${oc.env:INITIAL_IMAGE_PATH,/path/to/shared/datasets/close_desktop_lerobot_joint_3cam}"
initial_joint_state_path: "${oc.env:INITIAL_JOINT_STATE_PATH}"
initial_image_camera_keys:
  - "observation.images.d405_0_rgb"
  - "observation.images.d405_1_rgb"
  - "observation.images.d435_rgb"

ctrl_world_reward_model_path: null

ctrl_world_cfg:
  dtype: bf16

  ctrl_world_repo_path: ${env.train.ctrl_world_repo_path}
  ckpt_path: ${env.train.ctrl_world_ckpt_path}
  svd_model_path: ${env.train.ctrl_world_svd_model_path}
  clip_model_path: ${env.train.ctrl_world_clip_model_path}
  data_stat_path: ${env.train.ctrl_world_stat_path}

  chunk: 10
  condition_frame_length: 1
  num_history: 6
  action_dim: 7
  policy_action_type: joint_absolute
  policy_gripper_type: passthrough

  joint_action_adapter: fk
  joint_fk_tcp_xyz: [0.0, 0.0, 0.18]
  joint_fk_tcp_rotvec: [0.0, 0.0, 0.0]
  action_to_eef_adapter: joint_learned_fk
  joint_action_to_state_adapter_path: "${oc.env:JOINT_ACTION_TO_STATE_ADAPTER_PATH,''}"
  action_to_eef_adapter_path: "${oc.env:ACTION_TO_EEF_ADAPTER_PATH,''}"

  image_size: [192, 320]
  policy_image_size: [480, 640]
  # Opt-in: expose full-resolution dataset frames to the policy only on the
  # initial reset observation. Legacy/10D launchers keep the existing false
  # default; the Cosmos joint-7D launcher enables it explicitly.
  use_raw_reset_policy_views: false
  main_view_index: 0
  wrist_view_index: 2

  num_inference_steps: 50
  decode_chunk_size: 12
  guidance_scale: 1.0
  fps: 7
  motion_bucket_id: 127
  text_cond: True
  frame_level_cond: True
  his_cond_zero: False

  reward_model: null
