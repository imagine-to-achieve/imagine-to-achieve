# Nest-four-cups recent-history/training-view-order rollout: 32 nodes x 4 GPUs,
# 512 trajectories/update. This is opt-in and leaves the original rollout
# profile unchanged.
# 10 chunks x 32 actions = 320 actions (21.33 seconds at 15 FPS).
# 50-update objective. Submit 0:25 first with --until-update 25.
schema_version: 1
experiment_name: nest_four_cups_b512_c10_recent_views_32n4g_u50_gs1
runtime:
