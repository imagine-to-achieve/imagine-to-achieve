  checkpoint_target_rewrite: true
  strict_load: true
  action_dim: 10
  max_action_dim: 64
  action_representation: ur5_eef_relative_10d_droid_native
  action_normalization: qnorm
  action_chunk: 32
  action_fps: 15.0
  sampler: unipc
  sampler_steps: 15
  guidance: 1.0
  resolution_tier: 720
ctrl_world:
  architecture:
    sample_size: null
    in_channels: 8
    out_channels: 4
    down_block_types: [CrossAttnDownBlockSpatioTemporal, CrossAttnDownBlockSpatioTemporal, CrossAttnDownBlockSpatioTemporal, DownBlockSpatioTemporal]
    up_block_types: [UpBlockSpatioTemporal, CrossAttnUpBlockSpatioTemporal, CrossAttnUpBlockSpatioTemporal, CrossAttnUpBlockSpatioTemporal]
    block_out_channels: [320, 640, 1280, 1280]
    addition_time_embed_dim: 256
    projection_class_embeddings_input_dim: 768
    layers_per_block: 2
    cross_attention_dim: 1024
    transformer_layers_per_block: 1
    num_attention_heads: [5, 10, 20, 20]
    num_frames: 25
  runtime:
    action_dim: 7
    policy_action_dim: 10
    num_history: 6
    action_encoder_hidden_size: 1024
    text_cond: true
    frame_level_cond: true
    his_cond_zero: false
    policy_chunk: 32
    policy_action_fps: 15.0
    condition_fps: 30.0
    resample_actions: true
    resampled_chunk: 64
    internal_rollout: true
    window_frames: 5
    window_emit_frames: 4
    use_lookahead_latent: true
    history_mode: dense
    history_indices: [0, 1, 2, 3, 4, 5]
    history_bank_size: 6
    num_inference_steps: 20
    guidance_scale: 1.0
    decode_chunk_size: 7
    per_view_image_size: [192, 320]
    per_view_vae_codec: true
    action_to_eef_adapter: analytic_ur5_rot6d
reward:
  source: trajectory_mse
  video_similarity:
    enabled: true
    metric: negative_mse
    alignment_mode: per_chunk
    camera_layout: droid
    size: [192, 320]
    range_policy: zero_one
    scale: 1.0
  terminal_goal:
    enabled: true
    same_episode: true
    frame_index: -1
    window_size: 4
    size: [192, 320]
    range_policy: zero_one
    view_weights: [0.6666666666666666, 0.16666666666666666, 0.16666666666666666]
    scale: 160.0
  success_classifier:
    enabled: true
    diagnostic_only: true
    replace_training_reward: false
    threshold: 0.5
    aggregation: max
