# Clean four-color Duck trajectory-MSE run; fixed Cosmos/Ctrl-World interface and side-view success model.
schema_version: 1
experiment_name: duck4_b128_mb32_u50_traj_reward_fixediface_side_rm_8n4g
runtime:
  backend: ray_fsdp
  seed: 42
  dtype: bfloat16
  max_updates: 50
  segment_updates: 5
  continuous_stress: false
  output_dir: /path/to/rlinf_release/outputs/duck4_b128_mb32_u50_traj_reward_fixediface_side_rm_8n4g
  resume: false
  require_real_assets: true
  deterministic: false
  minimum_free_disk_gib: 0
  minimum_free_inodes: 0  # inode gate disabled: not enforced on this filesystem.
  max_gpu_reserved_fraction: 0.9
slurm:
  account: <SLURM_ACCOUNT>
  partition: gpu
  nodes: 8
  gpus_per_node: 4
  ntasks_per_node: 1
  cpus_per_task: 32
  memory: 400G
  time_limit: "24:00:00"
  signal_seconds: 300
batch:
  parallel_envs: 128
  rollout_epochs: 1
  trajectories_per_update: 128
  chunks_per_trajectory: 5
  global_minibatch_chunks: 160
  micro_batch_size_per_gpu: 1
  gradient_accumulation_steps: 5
  expected_optimizer_steps: 4
  logical_rounds_per_update: 1
  group_slots_per_logical_round: 8
  waves_per_logical_round: 1
task:
  profile: duck
  mode: multi_task
  base_prompt: Pick up the duck and put it into the black box.
  allowed_variants: [brown, red, white, yellow]
  active_variants: [brown, red, white, yellow]
  train_episodes_per_variant: 40
  eval_episodes_per_variant: 10
  append_viewpoint_info: true
  append_duration_fps: true
  append_resolution_info: true
  rollout_cfg_dropout_rate: 0.0
  camera_labels: [main, wrist, extra]
  split_manifest_path: /path/to/rlinf_release/configs/duck_split_manifest.json
  variant_prompts:
    brown: Pick up the brown duck and put it into the black box.
    red: Pick up the red duck and put it into the black box.
    white: Pick up the white duck and put it into the black box.
    yellow: Pick up the yellow duck and put it into the black box.
algorithm:
  name: fpo_grpo
  advantage: grpo_action_suffix
  group_size: 16
  gamma: 0.95
  gae_lambda: null  # GRPO suffix recursion intentionally does not use GAE.
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  normalize_advantages: true
  logprob_level: chunk
trajectory_records:
  enabled: true
  mode: lightweight_analysis
  auto_analyze: true
  require_plots: true
fpo:
  replay_objective: fpo_action_head
  ratio_granularity: per_action
  score_parameterization: velocity
  num_mc_samples: 4
  time_distribution: waver
  training_shift: 10.0
  timestep_scale: 1000.0
  vision_state_channels: 48
  vision_condition_latent_frames: 1
  latent_downsample_factor: 16
  freeze_video_path: true
  train_action_path_only: true
optimizer:
  name: AdamW
  lr: 0.000002
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001
  weight_decay: 0.01
  clip_grad_norm: 5.0
cosmos:
  framework_version: 1.2.2
  data_parallel_shard_degree: 4
  checkpoint_path: /path/to/workspace/check-point/cosmos3_new/cosmos3_action/action_sft_ur5_eef/action_policy_ur5_eef_duck_0731_4color_160train_40val_15k/checkpoints/iter_000010000/model
