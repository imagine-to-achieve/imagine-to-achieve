schema_version: 1
experiment_name: synthetic_close_duck_smoke
runtime:
  backend: single
  seed: 42
  dtype: float32
  max_updates: 2
  segment_updates: 2
  continuous_stress: false
  output_dir: ./outputs/synthetic
  resume: true
  require_real_assets: false
  deterministic: true
  minimum_free_disk_gib: 1
  minimum_free_inodes: 1000
  max_gpu_reserved_fraction: 0.9
slurm:
  account: <SLURM_ACCOUNT>
  partition: gpu
  nodes: 1
  gpus_per_node: 1
  ntasks_per_node: 1
  cpus_per_task: 4
  memory: 32G
  time_limit: 00:30:00
  signal_seconds: 120
batch:
  parallel_envs: 8
  rollout_epochs: 1
  trajectories_per_update: 8
  chunks_per_trajectory: 5
  global_minibatch_chunks: 10
  micro_batch_size_per_gpu: 2
  gradient_accumulation_steps: 5
  expected_optimizer_steps: 4
  logical_rounds_per_update: 4
  group_slots_per_logical_round: 1
  waves_per_logical_round: 1
task:
  profile: synthetic
  mode: multi_task
  base_prompt: Close the laptop
  allowed_variants:
  - close
  - brown
  active_variants:
  - close
  - brown
  train_episodes_per_variant: 4
  eval_episodes_per_variant: 1
  append_viewpoint_info: true
  append_duration_fps: true
  append_resolution_info: true
  rollout_cfg_dropout_rate: 0.0
  camera_labels:
  - main
  - wrist
  - extra
  split_manifest_path: null
  variant_prompts:
    close: Close the laptop
    brown: Pick up the brown duck and put it into the black box.
algorithm:
  name: fpo_grpo
  advantage: grpo_action_suffix
  group_size: 2
  gamma: 0.95
  gae_lambda: null
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  normalize_advantages: true
  logprob_level: chunk
trajectory_records:
  enabled: true
  mode: lightweight_analysis
  auto_analyze: true
  require_plots: true
fpo:
  replay_objective: fpo_action_head
  ratio_granularity: per_action
  score_parameterization: velocity
  num_mc_samples: 4
  time_distribution: waver
  training_shift: 10.0
  timestep_scale: 1000.0
  vision_state_channels: 48
  vision_condition_latent_frames: 1
  latent_downsample_factor: 16
  freeze_video_path: true
  train_action_path_only: true
optimizer:
  name: AdamW
  lr: 2.0e-06
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  weight_decay: 0.01
  clip_grad_norm: 5.0
cosmos:
  framework_version: 1.2.2
  data_parallel_shard_degree: 1
  checkpoint_path: null
  checkpoint_config_path: null
  action_stats_path: null
  vlm_processor_path: null
  checkpoint_target_rewrite: false
  strict_load: true
  action_dim: 10
  max_action_dim: 64
  action_representation: relative_eef
  action_normalization: qnorm
  action_chunk: 32
  action_fps: 15.0
  sampler: unipc
  sampler_steps: 15
  guidance: 1.0
  resolution_tier: 720
ctrl_world:
  architecture:
    sample_size: null
    in_channels: 8
    out_channels: 4
    down_block_types:
    - CrossAttnDownBlockSpatioTemporal
    - CrossAttnDownBlockSpatioTemporal
    - CrossAttnDownBlockSpatioTemporal
    - DownBlockSpatioTemporal
    up_block_types:
    - UpBlockSpatioTemporal
    - CrossAttnUpBlockSpatioTemporal
    - CrossAttnUpBlockSpatioTemporal
    - CrossAttnUpBlockSpatioTemporal
    block_out_channels:
    - 320
    - 640
    - 1280
    - 1280
    addition_time_embed_dim: 256
    projection_class_embeddings_input_dim: 768
    layers_per_block: 2
    cross_attention_dim: 1024
    transformer_layers_per_block: 1
    num_attention_heads:
    - 5
    - 10
    - 20
    - 20
    num_frames: 25
  runtime:
    action_dim: 7
    policy_action_dim: 10
    num_history: 6
    action_encoder_hidden_size: 1024
    text_cond: true
    frame_level_cond: true
    his_cond_zero: false
    policy_chunk: 32
    policy_action_fps: 15.0
    condition_fps: 30.0
    resample_actions: true
    resampled_chunk: 64
    internal_rollout: true
    window_frames: 5
    window_emit_frames: 4
    use_lookahead_latent: true
    history_mode: sparse_window
    history_indices:
    - 0
    - 0
    - -12
    - -9
    - -6
    - -3
    history_bank_size: 24
    num_inference_steps: 20
    guidance_scale: 1.0
    decode_chunk_size: 7
    per_view_image_size:
    - 16
    - 16
    per_view_vae_codec: true
    action_to_eef_adapter: analytic_ur5_rot6d
reward:
  source: ctrl_world_aligned_mse_plus_terminal
  video_similarity:
    enabled: true
    metric: negative_mse
    alignment_mode: per_chunk
    camera_layout: droid
    size:
    - 16
    - 16
    range_policy: zero_one
    scale: 1.0
    view_weights: null
  terminal_goal:
    enabled: true
    same_episode: true
    frame_index: -1
    window_size: 4
    size:
    - 16
    - 16
    range_policy: zero_one
    view_weights:
    - 0.6666666666666666
    - 0.16666666666666666
    - 0.16666666666666666
    scale: 160.0
  success_classifier:
    enabled: false
    diagnostic_only: true
    replace_training_reward: false
    threshold: 0.5
    aggregation: mean
assets:
  legacy_config_name: null
  dataset_path: null
  ctrl_world_checkpoint: null
  ctrl_world_stats: null
  svd_model_path: null
  clip_model_path: null
  reward_models: {}
  expected_sha256: {}
distributed:
  backend: single
  ray_object_store_bytes: 1073741824
  ray_ready_timeout_seconds: 120
  collective_timeout_seconds: 60
  heartbeat_interval_seconds: 10
  actor_offload: false
  rollout_offload: false
  replay_cpu_resident: true
  activation_checkpointing: none
  fsdp_use_orig_params: true
evaluation:
  enabled: true
  interval_updates: 1
  episodes_per_variant: 1
  save_video: false
  fixed_seeds: false
  before_training: false
checkpoint:
  enabled: true
  interval_updates: 1
  keep_latest: 2
  atomic: true
  save_optimizer: true
  emergency_on_signal: true
